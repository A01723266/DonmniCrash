<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #151b21; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: 100vw; height: 100vh; background: #202a32; }
    @media (orientation: landscape) {
      canvas { width: min(100vw, 177.777778vh); height: min(100vh, 56.25vw); }
    }
    #loading { position: absolute; color: white; font: 1rem system-ui; }
  </style>
</head>
<body>
  <canvas id="game" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
  <div id="loading" role="status">Cargando… <progress max="1" value="0"></progress></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const status = document.getElementById("loading");
    const progress = status.querySelector("progress");
    createUnityInstance(document.getElementById("game"), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    }, value => { progress.value = value; })
      .then(() => status.remove())
      .catch(error => { status.textContent = String(error); });
  </script>
</body>
</html>
